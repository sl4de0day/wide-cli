name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and Build
        run: npm run build

      - name: Run Test Suite
        run: npm test

      - name: Dogfood Wide Security Scan
        uses: sl4de0day/wide-action@v1
        with:
          fail-on: CRITICAL

      - name: Publish to npm on Version Change
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$EVENT_NAME" != "workflow_dispatch" ] && git rev-parse HEAD~1 >/dev/null 2>&1; then
            PREVIOUS=$(git show HEAD~1:package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" 2>/dev/null || echo "")
            if [ "$CURRENT" = "$PREVIOUS" ]; then
              echo "Version unchanged ($CURRENT); skipping npm publish."
              exit 0
            fi
          fi
          EXISTING=$(npm view "wide-cli@${CURRENT}" version 2>/dev/null || true)
          if [ "$EXISTING" = "$CURRENT" ]; then
            echo "wide-cli@${CURRENT} is already published on npm; skipping."
            exit 0
          fi
          npm install -g npm@latest
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
          export CURRENT_VER="$CURRENT"
          node -e "const fs=require('node:fs'); fs.writeFileSync('src/index.ts', fs.readFileSync('src/index.ts','utf8').replace(/\.version\(\"[^\"]+\"\)/, '.version(\"' + process.env.CURRENT_VER + '\")'));"
          npm run build
          npm publish --provenance --access public
          TAG="v${CURRENT}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Wide CLI $CURRENT" --generate-notes --latest
          fi
