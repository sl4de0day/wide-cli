name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and Build
        run: npm run build

      - name: Run Test Suite
        run: npm test

      - name: Dogfood Wide Security Scan
        uses: sl4de0day/wide-action@v1
        with:
          fail-on: CRITICAL

      - name: Auto-Publish to npm
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "workflow_dispatch" ] && git rev-parse HEAD~1 >/dev/null 2>&1; then
            if ! git diff --name-only HEAD~1 HEAD | grep -Eq '^(src/|bin/|package\.json$)'; then
              echo "No changes in src/, bin/, or package.json; skipping npm publish."
              exit 0
            fi
          fi
          npm install -g npm@latest
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
          PKG_VER=$(node -p "require('./package.json').version")
          EXISTING=$(npm view "wide-cli@${PKG_VER}" version 2>/dev/null || true)
          if [ "$EXISTING" = "$PKG_VER" ]; then
            STAMP=$(date -u +"%d%m%y%H%M")
            export NEW_VER="0.5.${STAMP}"
            npm version "$NEW_VER" --no-git-tag-version
            node -e "const fs=require('node:fs'); fs.writeFileSync('src/index.ts', fs.readFileSync('src/index.ts','utf8').replace(/\.version\(\"[^\"]+\"\)/, '.version(\"' + process.env.NEW_VER + '\")'));"
            npm run build
          fi
          if ! npm publish --provenance --access public; then
            STAMP=$(date -u +"%d%m%y%H%M")
            export NEW_VER="0.5.${STAMP}"
            npm version "$NEW_VER" --no-git-tag-version
            node -e "const fs=require('node:fs'); fs.writeFileSync('src/index.ts', fs.readFileSync('src/index.ts','utf8').replace(/\.version\(\"[^\"]+\"\)/, '.version(\"' + process.env.NEW_VER + '\")'));"
            npm run build
            npm publish --provenance --access public
          fi
